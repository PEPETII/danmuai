name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Verify generated Web assets
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check:css
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python web/static/build_index_html.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/build_locale_shards.py --check
          exit $LASTEXITCODE

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt --dry-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: ruff check app main.py tests scripts

      - name: Run Node tests
        shell: pwsh
        run: |
          $nodeTests = @(Get-ChildItem -LiteralPath 'tests' -Filter 'test_*.mjs' -File -ErrorAction Stop | Sort-Object Name | Select-Object -ExpandProperty FullName)
          if ($nodeTests.Count -eq 0) {
            throw 'No Node tests found in tests/test_*.mjs.'
          }
          Write-Host "Running $($nodeTests.Count) Node test files."
          node --test --test-concurrency=1 @nodeTests
          exit $LASTEXITCODE

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

  pack-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-release-win-lock.txt

      - name: Select CI release Python
        shell: pwsh
        run: |
          $pythonPath = (Get-Command python).Source
          "DANMU_BUILD_PYTHON=$pythonPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install vpk
        run: dotnet tool install -g vpk

      - name: Install release lock dependencies
        run: |
          python -m pip install -r requirements-release-win-lock.txt

      - name: Check release dependency consistency
        run: python -m pip check

      - name: Verify release Python and lock drift
        run: .\scripts\verify_release_lock.ps1

      - name: Publish script DryRun (release preflight smoke)
        run: .\scripts\publish_windows_release.ps1 -DryRun

      - name: Build with PyInstaller
        run: .\scripts\build_exe.ps1 -SkipDependencyInstall

      - name: Velopack pack
        run: .\scripts\velopack_pack.ps1

      - name: Verify release artifacts
        run: .\scripts\verify_windows_release_artifacts.ps1 -ReleaseDir "release\velopack"
