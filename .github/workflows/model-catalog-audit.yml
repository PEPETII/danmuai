name: Model catalog audit

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-model-audit.txt
      - name: Install audit dependencies
        run: python -m pip install -r requirements-model-audit.txt
      - name: Audit model catalog
        run: python scripts/audit_model_catalog.py --json
